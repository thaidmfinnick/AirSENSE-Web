<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồ án</title>
    <link rel="stylesheet" href="/static/hk2_2021/OrderWeb/style.css">
</head>

<body>
    <header>
        <p>Order List</p>
    </header>
    
    <div class="order">
        <ul id="menu-order">
            
        </ul>
        
        <form id="Add-form">
            <div>
                <label>Tên đồ ăn</label>
                <input name="name" type="text" id="name-add">
            </div>
            <div>
                <label>Số lượng</label>
                <input name="num" type="number" min="1" max="100" id="quantity-add">
            </div>
            <div>
                <label>Giá tiền</label>
                <input name="total" type="number" min="1" max="100" id="total-add">
            </div>
        </form>

        <button id="Add">Thêm sản phẩm</button>
        <div class="order-info">
            <p>
                <span>Thành tiền</span>
                <span id="subtotal"></span>
            </p>
            <p>
                <span>Phí ship</span>
                <span id="shipping"></span>
            </p>
            <p>
                <span>Tổng số tiền cần thanh toán</span>
                <span id="total"></span>
            </p>
        </div>

        <button class="btn-checkout">check out</button>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="text/javascript" src="http://ajax.aspnetcdn.com/ajax/jquery.validate/1.13.1/jquery.validate.min.js"></script>
    <script type="text/javascript" src="/static/hk2_2021/OrderWeb/code.js"></script>
</body>

</html>
