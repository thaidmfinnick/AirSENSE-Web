<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title> Project1_Account_Management</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css">


</head>

<body style="  display: flex; flex-direction: column;">
    <div class="container" style="width: 100%;">
        <div class="header" style="width: 100%;">
            <h2>Quản lý nhân viên</h2>
            <form method="POST" id="Main_Form_ID">
                <div class="form-group">
                    <label for="">ID:</label>
                    <input type="text" class="form-control" id="name_id">
                </div>
                <div class="form-group">
                    <label for="">Email:</label>
                    <input type="text" class="form-control" id="email">
                </div>
                <div class="form-group">
                    <label for="">UserName:</label>
                    <input type="text" class="form-control" id="username">
                </div>
                <div class="form-group">
                    <label for="">FullName:</label>
                    <input type="text" class="form-control" id="fullname">
                </div>
                <div class="form-group">
                    <label for="sel1">Select a Department</label>
                    <select class="form-control" id="department_id">
                        <option>Chọn phòng ban đi</option>
                        <!-- <option>Accounting</option>
                        <option>Business Development</option>
                        <option>Engineering</option>
                        <option>Human Resources</option>
                        <option>Research and Development</option> -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="sel1">Select a Position</label>
                    <select class="form-control" id="position_id">
                        <option>Muốn làm gì</option>
                        <!-- <option>Developer</option>
                        <option>Tester</option>
                        <option>Scrum Master</option>
                        <option>PM</option> -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="">Cretate Date:</label>
                    <input type="date" required="true" class="form-control" id="Cretate_Date_ID" value="">
                </div>

                <div class="form-group" id="btn_id">
                    <input type="submit" value="Save" class="btn btn-success" id="save_btn">
                    <input type="button" value="Update" class="btn btn-success" id="update_btn">
                    <input type="button" value="Reset" class="btn btn-success" id="reset_btn">
                </div>
            </form>
        </div>
    </div>
    <br>
    <br>

    <div class="container">
        <h2>Thông tin nhân viên trên hệ thống</h2>
        <table class="table table-hover" id="Detail_Staff_ID">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Fullname</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Cretate Date</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            <tbody id="Result_TB">

            </tbody>

            </thead>
        </table>

    </div>


    <script type="text/javascript" src="main.js"></script>
</body>

</html>
