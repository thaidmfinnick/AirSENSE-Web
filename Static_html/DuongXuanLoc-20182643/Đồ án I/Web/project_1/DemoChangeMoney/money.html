<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Money</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />  </head>
  <body>
    <main>
      <header>
        <h1>Change Money</h1>
      </header>
      <div class="inputs ">
        <select name="" id="leftSelect" class="form-control vnd" required="required">
          <option value="1">VND</option>
          <option value="23000">USD</option>
          <option value="27000">EURO</option>
          <option value="20">WON</option>
          <option value="309">RUP</option>
        </select>
        <i class="fa fa-arrows-h" aria-hidden="true" ></i>
        <select name="" id="rightSelect" class="form-control usd" required="required">
          <option value="1">VND</option>
          <option value="23000">USD</option>
          <option value="27000">EURO</option>
          <option value="20">WON</option>
          <option value="309">RUP</option>
        </select>
    
      </div>
      <div class="inputs">
        <input
          type="number"
          id="input1"
          class="vnd"
          placeholder="......"
        />
        <i class="fa fa-arrows-h" aria-hidden="true"></i>
        <input
          type="number"
          id="input2"
          class="usd"
          placeholder="......"
        />
      </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="text/javascript" src="main.js"></script>
  </body>
</html>
