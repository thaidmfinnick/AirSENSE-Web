<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="login">
        <p class="login-adver">Đăng nhập cùng chúng tôi để có nhiều trải nghiệm hơn</p>
        <form class="login-form">
            <p class="login-note">Vietnamese</p>
            <h2 class="login-title">Đăng nhập</h2>
            <div class="login-with-google">
                <p class="login-with-para">Đăng nhập với</p>

            </div>
            <div class="login-with-facebook">
                <p class="login-with-para">Đăng nhập với</p>
                
            </div>
            <input type="text" class="login-input-email" placeholder="Email hoặc số điện thoại" />
            <input type="password" class="login-input-password" placeholder="Mật khẩu" />
            <button class="login-button">Đăng nhập</button>
            <p class="link-to-register">Nếu bạn chưa có tài khoản, xin mời <a href="#" class="link-register">đăng kí</a></p>

        </form>
    </div>
</body>
</html>
